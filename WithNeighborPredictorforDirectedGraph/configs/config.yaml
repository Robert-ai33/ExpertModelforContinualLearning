default:
  # Model
  hidden_dim: 128
  neighbor_hidden_dim: 128
  dropout: 0.5
  num_experts: 9

  # Training
  epochs: 700
  cls_epochs: 100
  out_epochs: 300
  # in_epochs = epochs - cls_epochs - out_epochs = 100
  lr: 0.001
  weight_decay: 0.0005
  batch_size: 256

  # Neighbor prediction
  num_neg_samples: 3
  neighbor_topk_offset: 50

  # Validation
  valid_epoch: 10
  patience: 9999

  # Other
  seed: [42, 123, 456]
  debug: false
