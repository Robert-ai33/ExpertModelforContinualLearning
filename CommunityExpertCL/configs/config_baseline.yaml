# Baseline Methods Configuration
# Shared by all baseline CL methods (bare, joint, ewc, mas, lwf, gem, twp, ergnn, cat, cosine, teen, delome)

default:
  seed: [0, 1, 2, 3, 4]

  # --- Data Splitting ---
  split_S: 5
  split_t: 3
  split_v: 1

  # --- GCN Backbone ---
  gcn_hidden_dim: 256
  gcn_layers: 2
  gcn_dropout: 0.0

  # --- Training ---
  baseline_epochs: 200
  baseline_lr: 0.005
  baseline_weight_decay: 5.0e-4
  batch_size: 256

  # --- EWC ---
  ewc_lambda: 10000.0

  # --- MAS ---
  mas_lambda: 1.0

  # --- LwF ---
  lwf_lambda: 1.0
  lwf_temperature: 2.0

  # --- GEM ---
  gem_margin: 0.5
  gem_n_memories: 20

  # --- TWP ---
  twp_lambda_l: 10000.0
  twp_beta: 0.01

  # --- ER-GNN ---
  ergnn_budget: 100
  ergnn_d: 0.5
  ergnn_replay_weight: 1.0

  # --- CaT (CGM) ---
  cat_budget: 400
  cat_n_encoders: 10
  cat_feat_lr: 0.01
  cat_hid_dim: 256
  cat_emb_dim: 128
  cat_n_layers: 2
  cat_hop: 1
  cat_activation: true       # original Encoder.activation flag (ReLU between layers)
  cat_tim: false             # true = CaT paper "Train In Memory" headline setting:
                             #        each session trains only on condensed memory
                             #        (current + past). false = memory_bank[:k]+[tasks[k]]
                             #        non-TIM setting.

  # --- COSINE ---
  cosine_T: 16.0

  # --- TEEN ---
  teen_T: 16.0
  teen_softmax_t: 20.0
  teen_shift_weight: 0.1

  # --- DeLoMe ---
  delome_budget: 100
  delome_tro: 1.0
  delome_condense_epochs: 900   # original hard-codes self.epochs=900 in GCond
  delome_feat_lr: 0.0001
  delome_sgc_k: 2
  delome_hidden_dim: 256        # legacy single-hidden-dim knob (kept for compat)
  delome_sgc_h_dims: [256]      # matches Backbones/gnns.py SGC_args['h_dims']
  delome_sgc_bn: false          # original SGC_args['batch_norm'] default off
  delome_sgc_dropout: 0.0       # original SGC_args['dropout'] default 0
  delome_sgc_linear_bias: true  # original SGC_args['linear_bias']
  delome_cls_balance: logita
  delome_condense_seed: 42      # original GCond.set_seed(42)

  # --- SEED (multi-expert + per-class GMM + Bayes ensemble) ---
  # Default to a compact 64-d embedding so that per-class GMMs are
  # tractable on graph datasets whose classes often have only tens of
  # training nodes.  Override seed_hidden_dim / seed_feat_dim per dataset
  # if you have room.
  seed_hidden_dim: 256
  seed_feat_dim: 256
  seed_nepochs: 200          # epochs for training a fresh expert
  seed_ftepochs: 100         # epochs when finetuning an existing expert
  seed_lr: 0.005
  seed_weight_decay: 5.0e-4
  seed_ftwd: 0.0
  seed_clipgrad: 10000.0
  seed_max_experts: 17        # cap on backbones held concurrently
  seed_gmms: 1               # mixture components per class (k=1 = one Gaussian)
  seed_alpha: 0.99           # weight of MSE feature-KD during finetune
  seed_tau: 3.0              # softmax temperature for Bayes aggregation
  seed_use_multivariate: false  # full-cov GMM (needs many samples); keep off by default
  seed_use_nmc: false        # nearest-mean classifier instead of Bayes
  seed_init_strategy: random  # 'first' copies expert-0 backbone, 'random' fresh init

