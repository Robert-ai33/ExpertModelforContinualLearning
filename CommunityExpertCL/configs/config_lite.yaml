# LiteExpertCL Configuration
# Lightweight expert model with parameter-free GCN

default:
  seed: [0, 1, 2, 3, 4]

  # --- Data Splitting ---
  split_S: 5
  split_t: 3
  split_v: 1

  # --- Expert Parameters ---
  max_experts: 17            # merge when reaching this capacity

  # --- Parameter-free GCN ---
  gcn_layers: 2           # number of message-passing hops

  # --- Classifier ---
  cls_hidden_dim: 256
  cls_epochs: 200
  cls_lr: 0.01
  cls_weight_decay: 5.0e-4

  # --- MAE ---
  mae_epochs: 200
  mae_lr: 1.0e-3
  mae_weight_decay: 1.0e-4
  mask_ratio: 0.25
  mae_gamma: 2
  pearson_weight: 0.6
  norm_ratio_weight: 0.3
  # Ablation switch for the MAE objective used in training / validation /
  # pseudo-data generation / expert routing. Options:
  #   joint -- default, scaled-cosine + pearson_weight*Pearson
  #            + norm_ratio_weight*norm-ratio (the original three-term loss).
  #   mse   -- plain F.mse_loss(recon, target); the two weights above are
  #            ignored in this mode.
  mae_loss: joint

  # --- Neighbor Predictor ---
  np_hidden_dim: 256
  np_epochs: 200
  np_lr: 1.0e-3
  np_weight_decay: 1.0e-4
  np_neg_ratio: 1
  np_topk_ratio: 0.05
  neighbor_stats_weight: 1.0

  # --- Training ---
  batch_size: 256
  valid_epoch: 10
  patience: 9999
  infer_batch_size: 4096

  # --- Expert Merging ---
  merge_pseudo_samples: 50     # number of pseudo data points per class (total = num_classes * this)
  merge_pseudo_steps: 300      # optimization steps for pseudo data generation
  merge_pseudo_lr: 0.05         # Adam lr for pseudo data optimization
  merge_entropy_weight: 0.1    # weight for classifier entropy loss
  merge_diversity_weight: 0.1  # weight for pairwise diversity loss
  merge_temperature: 1.5       # temperature T for soft label distillation
  merge_distill_mae_epochs: 100
  merge_distill_cls_epochs: 100
  merge_distill_np_epochs: 100
  merge_distill_np_samples: 300   # node pairs per epoch for NP distillation

  # --- Debug ---
  debug: true
