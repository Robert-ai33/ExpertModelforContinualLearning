# TWP (Topology-aware Weight Preserving) Configuration
# Graph-specific regularization combining task importance and topology importance
# Loss = CE + twp_lambda * sum_i (I_task + twp_beta * I_topo)_i * (theta - theta*)^2

default:
  seed: [0, 1, 2, 3, 4]

  # --- Data Splitting ---
  split_S: 5
  split_t: 3
  split_v: 1

  # --- GCN Classifier ---
  gcn_hidden_dim: 256
  gcn_dropout: 0.5
  cls_epochs: 200
  cls_lr: 0.01
  cls_weight_decay: 5.0e-4

  # --- TWP Parameters ---
  twp_lambda: 1000.0     # overall regularization strength
  twp_beta: 0.01         # topology importance weight relative to task importance

  # --- Training ---
  batch_size: 256
  valid_epoch: 10
  patience: 9999

  # --- Debug ---
  debug: true
