# LwF (Learning without Forgetting) Configuration
# Knowledge distillation: preserve old model outputs on new task data
# Loss = CE + lwf_alpha * KL(old_soft || new_soft) * T^2

default:
  seed: [0, 1, 2, 3, 4]

  # --- Data Splitting ---
  split_S: 5
  split_t: 3
  split_v: 1

  # --- GCN Classifier ---
  gcn_hidden_dim: 256
  gcn_dropout: 0.5
  cls_epochs: 200
  cls_lr: 0.01
  cls_weight_decay: 5.0e-4

  # --- LwF Parameters ---
  lwf_alpha: 1.0         # distillation loss weight
  lwf_temperature: 2.0   # softmax temperature for distillation

  # --- Training ---
  batch_size: 256
  valid_epoch: 10
  patience: 9999

  # --- Debug ---
  debug: true
