# CommunityExpertCL Configuration
# Expert-based continual learning for graph data

default:
  seed: [0, 1, 2, 3, 4]

  # --- Data Splitting ---
  split_S: 5       # denominator for train/valid ratio
  split_t: 3       # train ratio = t/S
  split_v: 1       # valid ratio = v/S

  # --- Expert Parameters ---
  num_experts: 10

  # --- GCN Classifier ---
  gcn_hidden_dim: 256
  gcn_dropout: 0.5
  cls_epochs: 200
  cls_lr: 0.01
  cls_weight_decay: 5.0e-4

  # --- Graph MAE ---
  mae_hidden_dim: 256
  mae_epochs: 200
  mae_lr: 1.0e-3
  mae_weight_decay: 1.0e-4
  mask_ratio: 0.4     # fraction of dimensions to mask (lambda)
  mae_gamma: 2        # scaled cosine error exponent
  pearson_weight: 0.5 # weight for 1-Pearson correlation loss (0 to disable)
  norm_ratio_weight: 0.3  # weight for (log(||recon||)-log(||x||))^2 loss (0 to disable)
  use_dispersion_loss: false   # whether to use mask_token dispersion loss
  dispersion_weight: 0.1      # weight for mask_token dispersion loss
  dispersion_margin: 0.1       # max allowed cosine sim with old tokens

  # --- Training ---
  batch_size: 256
  valid_epoch: 10
  patience: 9999
  infer_batch_size: 4096  # inference batch size for expert selection (0 = no batching)

  # --- Debug ---
  debug: true
